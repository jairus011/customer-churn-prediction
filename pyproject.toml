[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn"
version = "0.1.0"
description = "Leakage-aware telco churn analysis and modelling"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn==1.8.0", "openpyxl>=3.1,<4", "matplotlib>=3.9,<4", "joblib>=1.4,<2", "streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbformat>=5,<6", "ipykernel>=6,<8", "matplotlib-inline>=0.1,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
